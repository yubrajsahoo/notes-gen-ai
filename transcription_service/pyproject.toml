[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription_service"
version = "0.1.0"
description = "A FastAPI backend for audio transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
    "python-json-logger>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "httpx2>=2.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "cosmic-ray>=8.7.0",
    "mutmut>=3.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, W: pycodestyle warnings
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mutmut]
paths_to_mutate = "app/"
tests_dir = "tests/"
runner = "pytest -o addopts=''"