[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html:coverage_html --cov-fail-under=80"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "venv/*",
    "test/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "venv",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatting)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", "venv", ".pytest_cache", "__pycache__"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv",
    ".pytest_cache",
]

[tool.bandit]
exclude_dirs = ["venv", "test", ".pytest_cache"]
skips = ["B104"]  # B104: binding to 0.0.0.0 is standard for dockerized microservices
